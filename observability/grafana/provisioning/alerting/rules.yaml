apiVersion: 1
groups:
- orgId: 1
  name: MLOps pipeline
  folder: MLOps
  interval: 10s
  rules:
  - uid: hw5-queue-full
    title: Очередь заполнена более 90%
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    annotations:
      description: Лимит x-max-length = 20, порог 90%, требуется устойчивое заполнение
        1 минуту
    labels:
      severity: warning
      project: music-mood-search
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 120
        to: 0
      model:
        refId: A
        expr: max(rabbitmq_detailed_queue_messages_ready{queue="music.tasks"}) - 18
        instant: true
        range: false
        datasource: &id001
          type: prometheus
          uid: prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            params:
            - 0.0
            type: gt
  - uid: hw5-dlq
    title: Сообщения в DLQ
    condition: C
    for: 10s
    noDataState: OK
    execErrState: Error
    annotations:
      description: Любое сообщение в DLQ требует разбора
    labels:
      severity: warning
      project: music-mood-search
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 120
        to: 0
      model:
        refId: A
        expr: max(rabbitmq_detailed_queue_messages{queue="music.tasks.dlq"})
        instant: true
        range: false
        datasource: *id001
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            params:
            - 0.0
            type: gt
