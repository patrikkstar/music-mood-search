global:
  scrape_interval: 5s
  evaluation_interval: 10s
scrape_configs:
  - job_name: collector-metrics
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets: [ 'rabbitmq:15692' ]
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
