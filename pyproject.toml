[project]
name = "music-mood-search"
version = "0.2.0"
description = "Asynchronous MLOps web service"
readme = "README.md"
authors = [
    { name = "Анастасия Короткевич"},
    { name = "Арина Мищенко"},
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.7.8",
    "mlflow>=3.17,<4",
    "numpy>=1.26",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.6",
    "torch>=2.6",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[rabbitmq]>=4.15.0",
]
# Зависимости для EDA, обучения и работы с MinIO (не попадают в Docker-образ):
#   uv sync --group training
training = [
    "boto3>=1.35",
    "matplotlib>=3.9",
    "pyarrow>=17",
]

# PyTorch ставится только CPU-сборкой: с PyPI по умолчанию приходят
# CUDA-библиотеки на несколько гигабайт, которые сервису не нужны.
[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["training/data/out", "training/data/.venv"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    'ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers\.community\.rabbitmq',
]
